<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 1 - форма</title>
</head>
<body>
    <h2>Выравнивание текста в таблице</h2>
    <form action="z4-1b.php" method="get">
        <fieldset>
            <legend>Горизонтальное выравнивание (align)</legend>
            <label><input type="radio" name="align" value="left" checked> left</label>
            <label><input type="radio" name="align" value="center"> center</label>
            <label><input type="radio" name="align" value="right"> right</label>
        </fieldset>
        <fieldset>
            <legend>Вертикальное выравнивание (valign)</legend>
            <label><input type="radio" name="valign" value="top" checked> top</label>
            <label><input type="radio" name="valign" value="middle"> middle</label>
            <label><input type="radio" name="valign" value="bottom"> bottom</label>
        </fieldset>
        <button type="submit">Выполнить</button>
    </form>
</body>
</html>
