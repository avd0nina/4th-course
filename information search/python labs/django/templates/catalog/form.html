{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="narrow"><p class="eyebrow">Форма</p><h1>{{ title }}</h1><form method="post" class="form-card">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span>*</span>{% endif %}</label>{{ field }}{% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}{% endfor %}<div class="actions"><button class="button" type="submit">Сохранить</button><a class="button secondary" href="javascript:history.back()">Отмена</a></div></form></div>
{% endblock %}
